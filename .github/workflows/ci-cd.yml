name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: thamco
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: |
            product-service/package-lock.json
            user-service/package-lock.json
            frontend/package-lock.json

      - name: Install product-service dependencies
        run: cd product-service && npm ci

      - name: Install user-service dependencies
        run: cd user-service && npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run product-service tests
        run: cd product-service && npm test -- --coverage --watchAll=false
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:password@localhost:5432/thamco
          REDIS_URL: redis://localhost:6379
          USER_SERVICE_URL: http://localhost:3001

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Build Docker images
        run: |
          docker build -t thamco-product-service ./product-service
          docker build -t thamco-user-service ./user-service
          docker build -t thamco-frontend ./frontend

      - name: Test Docker Compose
        run: |
          docker-compose config --quiet
          echo "Docker Compose configuration is valid"

  security-scan:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  deploy:
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push Docker images
        run: |
          # Build and tag images for Azure Container Registry
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/product-service:${{ github.sha }} ./product-service
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/user-service:${{ github.sha }} ./user-service
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/frontend:${{ github.sha }} ./frontend

          # Also tag as latest
          docker tag ${{ secrets.ACR_NAME }}.azurecr.io/product-service:${{ github.sha }} ${{ secrets.ACR_NAME }}.azurecr.io/product-service:latest
          docker tag ${{ secrets.ACR_NAME }}.azurecr.io/user-service:${{ github.sha }} ${{ secrets.ACR_NAME }}.azurecr.io/user-service:latest
          docker tag ${{ secrets.ACR_NAME }}.azurecr.io/frontend:${{ github.sha }} ${{ secrets.ACR_NAME }}.azurecr.io/frontend:latest

          # Push images
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/product-service:${{ github.sha }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/user-service:${{ github.sha }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/frontend:${{ github.sha }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/product-service:latest
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/user-service:latest
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/frontend:latest

      - name: Deploy to Azure Container Apps
        run: |
          # Create/update container apps
          az containerapp update \
            --name product-service \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/product-service:${{ github.sha }} \
            --set-env-vars DATABASE_URL="${{ secrets.DATABASE_URL }}" \
                           REDIS_URL="${{ secrets.REDIS_URL }}" \
                           USER_SERVICE_URL="https://user-service.internal.azurecontainerapps.io" \
            --query properties.configuration.ingress.fqdn

          az containerapp update \
            --name user-service \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/user-service:${{ github.sha }} \
            --set-env-vars DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --query properties.configuration.ingress.fqdn

          az containerapp update \
            --name frontend \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/frontend:${{ github.sha }} \
            --query properties.configuration.ingress.fqdn

      - name: Get deployment URLs
        run: |
          echo "🚀 Deployment Complete!"
          echo "Frontend URL: https://$(az containerapp show --name frontend --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)"
          echo "Product API: https://$(az containerapp show --name product-service --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)"
          echo "User API: https://$(az containerapp show --name user-service --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)"
