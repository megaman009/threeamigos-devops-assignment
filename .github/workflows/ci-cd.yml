name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: thamco
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: |
            product-service/package-lock.json
            user-service/package-lock.json
            frontend/package-lock.json

      - name: Install product-service dependencies
        run: cd product-service && npm ci

      - name: Install user-service dependencies
        run: cd user-service && npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run product-service tests
        run: cd product-service && npm test -- --coverage --watchAll=false
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:password@localhost:5432/thamco
          REDIS_URL: redis://localhost:6379
          USER_SERVICE_URL: http://localhost:3001

      - name: Run user-service tests
        run: cd user-service && npm test -- --coverage --watchAll=false
        env:
          NODE_ENV: test

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Build Docker images
        run: |
          docker build -t thamco-product-service ./product-service
          docker build -t thamco-user-service ./user-service
          docker build -t thamco-frontend ./frontend

      - name: Validate Docker Compose
        run: docker compose config --quiet

  security-scan:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

  deploy:
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push images (SHA + latest)
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
          TAG: ${{ github.sha }}
          REACT_APP_PRODUCT_API_URL: ${{ secrets.REACT_APP_PRODUCT_API_URL }}
          REACT_APP_USER_API_URL: ${{ secrets.REACT_APP_USER_API_URL }}
          REACT_APP_DEMO_USER_ID: ${{ secrets.REACT_APP_DEMO_USER_ID }}
        run: |
          set -euo pipefail
          ACR_SERVER="${ACR_NAME}.azurecr.io"

          docker build -t "$ACR_SERVER/product-service:$TAG" ./product-service
          docker build -t "$ACR_SERVER/user-service:$TAG" ./user-service
          docker build \
            --build-arg REACT_APP_PRODUCT_API_URL="$REACT_APP_PRODUCT_API_URL" \
            --build-arg REACT_APP_USER_API_URL="$REACT_APP_USER_API_URL" \
            --build-arg REACT_APP_DEMO_USER_ID="$REACT_APP_DEMO_USER_ID" \
            -t "$ACR_SERVER/frontend:$TAG" \
            ./frontend

          docker tag "$ACR_SERVER/product-service:$TAG" "$ACR_SERVER/product-service:latest"
          docker tag "$ACR_SERVER/user-service:$TAG" "$ACR_SERVER/user-service:latest"
          docker tag "$ACR_SERVER/frontend:$TAG" "$ACR_SERVER/frontend:latest"

          docker push "$ACR_SERVER/product-service:$TAG"
          docker push "$ACR_SERVER/user-service:$TAG"
          docker push "$ACR_SERVER/frontend:$TAG"
          docker push "$ACR_SERVER/product-service:latest"
          docker push "$ACR_SERVER/user-service:latest"
          docker push "$ACR_SERVER/frontend:latest"

      - name: Deploy to Azure Container Apps
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACR_SERVER="${ACR_NAME}.azurecr.io"

          az containerapp update --only-show-errors -g "$RG" -n product-service --image "$ACR_SERVER/product-service:$TAG" -o none
          az containerapp update --only-show-errors -g "$RG" -n user-service --image "$ACR_SERVER/user-service:$TAG" -o none
          az containerapp update --only-show-errors -g "$RG" -n frontend --image "$ACR_SERVER/frontend:$TAG" -o none
